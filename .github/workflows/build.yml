name: Build & Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      pack_check:
        description: '打包后再跑一遍产物自检（启动 win-unpacked 里的应用）'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    # 只在 windows 上跑：产物是 NSIS 安装包，本地开发也在 windows，
    # 跨平台跑 CI 只会多出一批「这里不报错」的假绿灯。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # package-lock.json 里的 resolved 指向 npmmirror，CI 直接沿用；
      # 不覆盖 registry 是为了让锁文件里的完整性校验（integrity）继续生效。
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Package installer
        shell: pwsh
        run: |
          # 合并 stdout/stderr 再落盘：electron-builder 的错误走的是 stderr，
          # 不重定向的话失败日志里只有 npm 的壳，看不到真正报什么。
          # --publish never：v26 在 CI 下会隐式发布，缺 GH_TOKEN 直接失败（配置里已置 null，这里再显式一次）
          npx electron-builder --win --publish never *>&1 | Tee-Object -FilePath electron-builder.log
          if (-not (Test-Path electron-builder.log)) { '日志未生成' | Out-File electron-builder.log }
          exit $LASTEXITCODE

      - name: Surface failure tail
        if: failure()
        shell: pwsh
        run: |
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-Content electron-builder.log -Tail 80 | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Packaged-artifact check
        if: ${{ github.event.inputs.pack_check == 'true' }}
        run: npm run verify:package

      - name: Collect build metadata
        if: always()
        shell: pwsh
        run: |
          $out = "build-info"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          if (Test-Path release) {
            # 尺寸是这轮唯一有意义的产出指标，装完就删的 win-unpacked 不在产物里
            Get-ChildItem release -File |
              Where-Object { $_.Extension -in '.exe', '.blockmap' } |
              ForEach-Object { "{0}`t{1}" -f $_.Name, $_.Length } |
              Set-Content (Join-Path $out 'artifact-sizes.txt')
          } else {
            'release/ 不存在，构建未产出任何文件' | Set-Content (Join-Path $out 'artifact-sizes.txt')
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Torra-windows-build-${{ github.run_number }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            build-info/artifact-sizes.txt
            electron-builder.log
          if-no-files-found: warn
          retention-days: 30

      # 发布专用的干净包裹：只有要进 Release 的文件，不掺日志和 build-info。
      # Release 的下载列表会原样展示这里的文件名，所以构建日志不能混进来。
      - name: Collect release bundle
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $bundle = 'release-bundle'
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          $exes = @(Get-ChildItem release -File -Filter '*.exe')
          if ($exes.Count -lt 1) { 'release/ 下没有 .exe，终止发布' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append; exit 1 }
          # latest.yml 是应用内「检查更新」唯一的入口：没有它，Release 附件装得再全，
          # Torra 查起来也只有 404。缺这个文件就当作发布没完成 —— 悄悄传一个不带元数据的
          # Release，等于把同一个坑再埋一次（v0.1.0/v0.2.0 就是这样）。
          if (-not (Test-Path (Join-Path release 'latest.yml'))) {
            'release/latest.yml 不存在：electron-builder 没产出更新元数据，终止发布' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 1
          }
          Get-ChildItem release -File |
            Where-Object { $_.Extension -in '.exe', '.blockmap', '.yml' } |
            ForEach-Object { Copy-Item $_.FullName $bundle }
          Push-Location $bundle
          $rows = Get-ChildItem -Filter '*.exe' | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          # 必须是 LF：Set-Content 在 Windows PowerShell 下写 CRLF，
          # 而 sha256sum -c 会把行尾的 \r 当进文件名，Ubuntu 侧校验必挂。
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'SHA256SUMS.txt'), ($rows -join "`n") + "`n")
          Pop-Location

      - name: Upload release bundle
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Torra-release-bundle-${{ github.ref_name }}
          path: release-bundle/*
          if-no-files-found: error
          retention-days: 30

  # 发布与构建分开：electron-builder 的 publish 通道要 GH_TOKEN 且失败信息很薄，
  # 打包本身已经验证过一轮，这里只用 gh CLI 做一次「建 Release + 传附件」。
  release:
    needs: package
    # 自定义 if 会顶掉默认的 success() 判断，所以 needs 的结论必须显式写进来，
    # 否则打包红了这条任务照样跑，传上去一个空 Release。
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Torra-release-bundle-${{ github.ref_name }}
          path: bundle

      - name: Verify bundle checksums
        run: cd bundle && sha256sum --check --strict SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # 这条任务没有 checkout，工作目录不是 git 仓库：gh 找仓库只认
          # 命令参数 → GH_REPO → 当前目录的 git remote，不读 GITHUB_REPOSITORY，
          # 所以每条 gh 都必须显式 --repo，否则一进 API 前就报「no repository detected」。
          trap 'echo "发布失败，gh 的输出见上方日志（exit=$?）" >> "$GITHUB_STEP_SUMMARY"' ERR
          cat > notes.md <<'EOF'
          Windows 桌面客户端。未做代码签名，首次安装时 SmartScreen 会提示「未知发布者」，点「仍要打开」即可，属预期。

          | 文件 | 用途 |
          | --- | --- |
          | `Torra-Setup-<版本>.exe` | 安装版：可选安装目录，创建桌面/开始菜单快捷方式 |
          | `Torra-Portable-<版本>.exe` | 便携版：双击即用，不写注册表 |
          | `*.blockmap` | 增量更新差分文件，普通用户不用下载 |
          | `latest.yml` | 更新元数据，应用内「检查更新」读的就是这一份，不用手动下载 |
          | `SHA256SUMS.txt` | 校验和，`sha256sum -c SHA256SUMS.txt` |

          从这一版起，安装版可以在「设置 → 关于 → 检查更新」里直接升级：查到新版本后由你点下载，
          装的时候重启一次应用。便携版没有原地升级的位置，仍然要靠下载新的 exe 覆盖。

          登录态与会话存在用户目录下的 torra 数据目录，卸载安装版不会清掉它。
          EOF
          # 重推同一个 tag 时 Release 已存在，create 会直接失败；改成覆盖上传附件，
          # 免得为了重传一个文件先去手动删 Release。（gh release edit 不接受附件参数）
          # 不写 --latest：GitHub 对正式发布的 Release 会自动标记 latest，
          # 而 gh 会从 tag 后缀（-rc/-beta）自动推断 prerelease，两者撞上会直接报错。
          gh release create --repo "$GITHUB_REPOSITORY" "$TAG" --title "Torra $TAG" --notes-file notes.md bundle/* || {
            echo "Release $TAG 已存在，覆盖上传附件"
            gh release upload --repo "$GITHUB_REPOSITORY" "$TAG" bundle/* --clobber
          }
          gh release view --repo "$GITHUB_REPOSITORY" "$TAG" --json url,tagName,isDraft,assets \
            --jq '"发布完成: " + .url + " (" + .tagName + ", " + ((.assets | length) | tostring) + " 个附件)"' |
            tee -a "$GITHUB_STEP_SUMMARY"
