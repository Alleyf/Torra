name: Build & Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      pack_check:
        description: '打包后再跑一遍产物自检（启动 win-unpacked 里的应用）'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    # 只在 windows 上跑：产物是 NSIS 安装包，本地开发也在 windows，
    # 跨平台跑 CI 只会多出一批「这里不报错」的假绿灯。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # package-lock.json 里的 resolved 指向 npmmirror，CI 直接沿用；
      # 不覆盖 registry 是为了让锁文件里的完整性校验（integrity）继续生效。
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build installer
        run: npm run dist

      - name: Packaged-artifact check
        if: ${{ github.event.inputs.pack_check == 'true' }}
        run: npm run verify:package

      - name: Collect build metadata
        if: always()
        shell: pwsh
        run: |
          $out = "build-info"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          if (Test-Path release) {
            # 尺寸是这轮唯一有意义的产出指标，装完就删的 win-unpacked 不在产物里
            Get-ChildItem release -File |
              Where-Object { $_.Extension -in '.exe', '.blockmap' } |
              ForEach-Object { "{0}`t{1}" -f $_.Name, $_.Length } |
              Set-Content (Join-Path $out 'artifact-sizes.txt')
          } else {
            'release/ 不存在，构建未产出任何文件' | Set-Content (Join-Path $out 'artifact-sizes.txt')
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Torra-windows-build-${{ github.run_number }}
          path: |
            release/*.exe
            release/*.blockmap
            build-info/artifact-sizes.txt
          if-no-files-found: error
          retention-days: 30
