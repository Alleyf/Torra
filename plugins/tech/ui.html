<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>技术工作台</title>
<style id="wb-tokens">
:root {
  color-scheme: dark;
  --p-bg: #13191c; --p-fg: #e7eceb; --p-muted: #89979d; --p-border: rgba(255,255,255,.08);
  --p-card: #1a2226; --p-accent: #12ccd8; --p-danger: #d86a52; --p-warn: #d3b26a;
  --p-radius: 12px; --p-gap: 12px;

  --wb-bg: #13191c; --wb-sunk: #182024; --wb-muted: #202a2f;
  --wb-surface: #1a2226; --wb-surface-2: #1d272b; --wb-raised: #202a2f;
  --wb-sidebar: #161e21; --wb-daybar: #182024;
  --wb-ink: #e7eceb; --wb-ink-2: #d2dada; --wb-ink-3: #a5b0b3; --wb-ink-4: #89979d;
  --wb-line: rgba(255,255,255,.08); --wb-line-strong: rgba(255,255,255,.14); --wb-line-soft: rgba(255,255,255,.055);
  --wb-accent: #12ccd8; --wb-accent-ink: #2ce2e8; --wb-accent-soft: rgba(18,204,216,.13); --wb-accent-softer: rgba(18,204,216,.06);
  --wb-accent-contrast: #001416;
  --wb-hot: #d86a52; --wb-hot-soft: rgba(216,106,82,.13);
  --wb-amber: #d3b26a; --wb-amber-soft: rgba(211,178,106,.13);
  --wb-ok: #5fc79a; --wb-ok-soft: rgba(95,199,154,.13);
  --wb-r1: #d86a52; --wb-r2: #d18a5e; --wb-r3: #d3b26a; --wb-r4: #7b869a;
  --wb-card-shadow: none; --wb-card-shadow-hover: 0 6px 18px rgba(0,0,0,.35);
}
:root[data-theme="light"] {
  color-scheme: light;
  --p-bg: #faf9f6; --p-fg: #202a30; --p-muted: #657176; --p-border: rgba(0,0,0,.08);
  --p-card: #fff; --p-accent: #176b75; --p-danger: #b3402a; --p-warn: #b8873a;
  --wb-bg: #faf9f6; --wb-sunk: #f3f3ef; --wb-muted: #e9ede9;
  --wb-surface: #fff; --wb-surface-2: #fdfdfb; --wb-raised: #fff;
  --wb-sidebar: #fdfdfb; --wb-daybar: #f0f2ee;
  --wb-ink: #202a30; --wb-ink-2: #303c42; --wb-ink-3: #59656b; --wb-ink-4: #657176;
  --wb-line: #dfe4e1; --wb-line-strong: #d1d9d5; --wb-line-soft: #e9ede9;
  --wb-accent: #176b75; --wb-accent-ink: #145f68; --wb-accent-soft: rgba(23,107,117,.08); --wb-accent-softer: rgba(23,107,117,.05);
  --wb-accent-contrast: #fff;
  --wb-hot: #b3402a; --wb-hot-soft: rgba(179,64,42,.08);
  --wb-amber: #b8873a; --wb-amber-soft: rgba(184,135,58,.10);
  --wb-ok: #2f7d5c; --wb-ok-soft: rgba(47,125,92,.10);
  --wb-r1: #b3402a; --wb-r2: #a3642f; --wb-r3: #96702e; --wb-r4: #6b7684;
  --wb-card-shadow: 0 1px 2px rgba(32,42,48,.02); --wb-card-shadow-hover: 0 3px 12px rgba(32,42,48,.06);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; }
body {
  overflow: hidden;
  background: var(--wb-bg);
  color: var(--wb-ink);
  font: 13.5px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
::selection { background: var(--wb-accent-soft); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--wb-ink-4) 40%, transparent);
  border: 2px solid transparent; border-radius: 10px; background-clip: content-box;
}
::-webkit-scrollbar-track { background: transparent; }
:focus-visible { outline: 2px solid var(--wb-accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- 外壳：左侧资料栏 + 主内容 ---------- */
.app { display: grid; grid-template-columns: 188px minmax(0, 1fr); height: 100vh; }
.rail {
  display: flex; flex-direction: column; min-height: 0;
  padding: 14px 10px 12px;
  border-right: 1px solid var(--wb-line-soft);
  background: var(--wb-sidebar);
}
.brand { display: flex; align-items: center; gap: 9px; padding: 2px 8px 16px; }
.brand .mark {
  width: 28px; height: 28px; border-radius: 8px; flex: 0 0 auto;
  display: grid; place-items: center;
  background: linear-gradient(145deg, var(--wb-accent), color-mix(in srgb, var(--wb-accent) 55%, #000));
  color: var(--wb-accent-contrast); font-size: 13px; font-weight: 700;
}
.brand .name { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
.brand b { font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
.brand em { font-style: normal; font-size: 11px; color: var(--wb-ink-4); white-space: nowrap; }

.rail-nav { display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
.group-label {
  padding: 13px 9px 4px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--wb-ink-4);
}
.nav-item {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 7px 9px; border: 0; border-radius: 8px;
  background: transparent; color: var(--wb-ink-3);
  font-size: 13px; text-align: left; transition: background .15s, color .15s;
}
.nav-item svg { flex: 0 0 auto; opacity: .9; }
.nav-item:hover { background: var(--wb-accent-softer); color: var(--wb-ink); }
.nav-item.on { background: var(--wb-accent-soft); color: var(--wb-ink); font-weight: 600; }
.nav-item.on svg { color: var(--wb-accent); opacity: 1; }
.nav-item .badge {
  margin-left: auto; min-width: 17px; height: 17px; padding: 0 5px;
  display: grid; place-items: center; border-radius: 999px;
  background: var(--wb-accent); color: var(--wb-accent-contrast);
  font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.rail-foot {
  flex: 0 0 auto; margin-top: 10px; padding: 10px 8px 2px;
  border-top: 1px solid var(--wb-line-soft);
  display: flex; flex-direction: column; gap: 5px;
  font-size: 11px; color: var(--wb-ink-4);
}
.live-line { display: flex; align-items: center; gap: 6px; }
.live-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--wb-ok); flex: 0 0 auto;
  box-shadow: 0 0 0 3px var(--wb-ok-soft);
}
.src-link {
  align-self: flex-start; padding: 0; border: 0; background: none;
  color: var(--wb-ink-3); font-size: 11px; text-decoration: none;
}
.src-link:hover { color: var(--wb-accent); text-decoration: underline; }
.src-links { display: flex; align-items: center; gap: 7px; }
.src-sep { color: var(--wb-ink-4); opacity: .6; }

/* ---------- 主区 ---------- */
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--wb-bg); }
.content { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 22px 26px 56px; }
.wrap { width: 100%; max-width: 880px; margin: 0 auto; }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin: 2px 0 16px; }
.page-head h1 { margin: 0 0 4px; font-size: 20px; font-weight: 650; letter-spacing: -.015em; }
.page-head .sub { margin: 0; font-size: 12.5px; color: var(--wb-ink-4); }
.head-tools { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.mode-tag {
  display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px;
  border-radius: 999px; background: var(--wb-accent-soft); color: var(--wb-accent-ink);
  font-size: 11px; font-weight: 600; vertical-align: 2px;
}
.mode-tag.hot { background: var(--wb-hot-soft); color: var(--wb-hot); }
.mode-tag.daily { background: var(--wb-amber-soft); color: var(--wb-amber); }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--wb-line); border-radius: 8px;
  background: var(--wb-surface); color: var(--wb-ink-2);
  padding: 5px 11px; font-size: 12.5px; line-height: 1.4;
  transition: border-color .15s, background .15s, color .15s;
}
.btn:hover { border-color: var(--wb-line-strong); color: var(--wb-ink); background: var(--wb-surface-2); }
.btn.primary { background: var(--wb-accent); border-color: var(--wb-accent); color: var(--wb-accent-contrast); font-weight: 600; }
.btn.primary:hover { background: var(--wb-accent-ink); border-color: var(--wb-accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--wb-ink-3); }
.btn.ghost:hover { background: var(--wb-accent-softer); color: var(--wb-ink); }
.btn[disabled] { opacity: .55; cursor: default; }
.btn svg { flex: 0 0 auto; }

.layout-switch {
  display: inline-flex; align-items: center; gap: 1px; padding: 2px;
  border: 1px solid var(--wb-line); border-radius: 8px; background: var(--wb-surface);
}
.layout-btn {
  width: 26px; height: 23px; display: grid; place-items: center;
  border: 0; border-radius: 6px; background: transparent; color: var(--wb-ink-4);
  transition: background .15s, color .15s;
}
.layout-btn:hover { background: var(--wb-surface-2); color: var(--wb-ink-2); }
.layout-btn.on { background: var(--wb-accent-soft); color: var(--wb-accent-ink); }

/* ---------- 日期条 ---------- */
.daybar {
  position: sticky; top: -22px; z-index: 5;
  margin: -6px -6px 14px; padding: 10px 6px 9px;
  background: linear-gradient(var(--wb-bg) 78%, color-mix(in srgb, var(--wb-bg) 0%, transparent));
}
.days { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.days::-webkit-scrollbar { display: none; }
.day {
  flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 1px;
  min-width: 52px; padding: 5px 9px 6px; border: 1px solid transparent; border-radius: 9px;
  background: transparent; color: var(--wb-ink-4); line-height: 1.25;
  transition: background .15s, color .15s, border-color .15s;
}
.day b { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.day small { font-size: 10px; letter-spacing: .02em; }
.day:hover { background: var(--wb-accent-softer); color: var(--wb-ink); }
.day.on { background: var(--wb-accent); border-color: var(--wb-accent); color: var(--wb-accent-contrast); }
.day.on small { opacity: .85; }
.day.today:not(.on) { border-color: color-mix(in srgb, var(--wb-accent) 45%, transparent); color: var(--wb-accent-ink); }

/* ---------- 导语 ---------- */
.lead {
  position: relative; overflow: hidden;
  margin-bottom: 16px; padding: 16px 18px 15px;
  border: 1px solid var(--wb-line); border-radius: 14px;
  background:
    radial-gradient(120% 90% at 100% 0%, var(--wb-hot-soft), transparent 55%),
    var(--wb-surface);
  box-shadow: var(--wb-card-shadow);
}
.lead .kicker {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--wb-hot); font-weight: 600;
}
.lead h2 { margin: 7px 0 6px; font-size: 15.5px; line-height: 1.45; letter-spacing: -.01em; }
.lead p { margin: 0; font-size: 12.8px; line-height: 1.66; color: var(--wb-ink-3); }

/* ---------- 热点列表 ---------- */
.list { display: flex; flex-direction: column; gap: 8px; }
/* 卡片密度：列表 / 两列 / 三列。窄窗口自动降列，宁可变一列也不硬挤 */
:root[data-layout="grid2"] .list.cards,
:root[data-layout="grid3"] .list.cards { display: grid; align-items: stretch; gap: 10px; }
:root[data-layout="grid2"] .list.cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
:root[data-layout="grid3"] .list.cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
:root[data-layout="grid2"] .list.cards > .section-label,
:root[data-layout="grid3"] .list.cards > .section-label { grid-column: 1 / -1; }
:root[data-layout="grid2"] .list.cards > .item,
:root[data-layout="grid3"] .list.cards > .item {
  grid-template-columns: 30px minmax(0, 1fr); gap: 8px; padding: 12px 14px 11px;
}
:root[data-layout="grid2"] .list.cards > .item.deal,
:root[data-layout="grid3"] .list.cards > .item.deal { grid-template-columns: 42px minmax(0, 1fr); }
:root[data-layout="grid2"] .list.cards .rank,
:root[data-layout="grid3"] .list.cards .rank { font-size: 15px; }
:root[data-layout="grid2"] .list.cards .deal-date,
:root[data-layout="grid3"] .list.cards .deal-date { font-size: 12px; }
:root[data-layout="grid2"] .list.cards .item-main,
:root[data-layout="grid3"] .list.cards .item-main { display: flex; flex-direction: column; height: 100%; }
:root[data-layout="grid2"] .list.cards .item-head,
:root[data-layout="grid3"] .list.cards .item-head { font-size: 11px; gap: 6px; }
/* 多列时来源行会折行，分隔点落到行首像多出来的标点，干脆藏掉 */
:root[data-layout="grid2"] .list.cards .item-head .sep,
:root[data-layout="grid3"] .list.cards .item-head .sep { display: none; }
:root[data-layout="grid2"] .list.cards .item-title,
:root[data-layout="grid3"] .list.cards .item-title { font-size: 13.6px; line-height: 1.5; }
:root[data-layout="grid2"] .list.cards .item-summary,
:root[data-layout="grid3"] .list.cards .item-summary { font-size: 12.2px; line-height: 1.62; }
/* 同一行的卡片等高，操作区贴底，扫一眼不会参差 */
:root[data-layout="grid2"] .list.cards .item-foot,
:root[data-layout="grid3"] .list.cards .item-foot { margin-top: auto; padding-top: 9px; }
:root[data-layout="grid2"] .wrap.cards,
:root[data-layout="grid3"] .wrap.cards { max-width: 1080px; }
@media (max-width: 940px) {
  :root[data-layout="grid3"] .list.cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 660px) {
  :root[data-layout="grid2"] .list.cards,
  :root[data-layout="grid3"] .list.cards { grid-template-columns: minmax(0, 1fr); }
}
.item {
  display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px;
  padding: 13px 16px 12px;
  border: 1px solid var(--wb-line-soft); border-radius: 12px;
  background: var(--wb-surface);
  box-shadow: var(--wb-card-shadow);
  transition: border-color .15s, background .15s, box-shadow .15s, transform .15s;
}
.item:hover, .item:focus-within {
  border-color: var(--wb-line-strong); background: var(--wb-surface-2);
  box-shadow: var(--wb-card-shadow-hover); transform: translateY(-1px);
}
.rank {
  padding-top: 1px; font-size: 17px; font-weight: 700; line-height: 1.25;
  color: var(--wb-r4); font-variant-numeric: tabular-nums; letter-spacing: -.02em;
}
.rank.r1 { color: var(--wb-r1); }
.rank.r2 { color: var(--wb-r2); }
.rank.r3 { color: var(--wb-r3); }
.item-main { min-width: 0; }
.item-head {
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  font-size: 11.5px; color: var(--wb-ink-4); line-height: 1.5;
}
.item-head .src { color: var(--wb-ink-3); font-weight: 500; }
/* 图标底板固定为白：暗色下多数站点给的是黑色透明 logo，
   跟着主题变深会整块糊掉；白底加一圈极淡描边，两个主题都不刺眼 */
.favicon {
  width: 16px; height: 16px; flex: 0 0 auto; object-fit: contain; padding: 2px;
  border-radius: 4px; background: #fff; box-shadow: 0 0 0 1px rgba(120, 130, 145, .22);
}
.item-head .sep { width: 2px; height: 2px; border-radius: 50%; background: currentColor; opacity: .6; }
.item-title { margin: 4px 0 0; font-size: 14.5px; font-weight: 600; line-height: 1.5; letter-spacing: -.01em; }
.item-title a { color: inherit; text-decoration: none; }
.item-title a:hover { color: var(--wb-accent-ink); text-decoration: underline; text-underline-offset: 2px; }
.item-summary {
  margin: 5px 0 0; font-size: 12.6px; line-height: 1.66; color: var(--wb-ink-3);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.item-summary.open { -webkit-line-clamp: unset; display: block; }
.item-foot {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-top: 9px; font-size: 11.5px; color: var(--wb-ink-4);
}
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 7px; border: 1px solid var(--wb-line); border-radius: 999px;
  font-size: 10.5px; color: var(--wb-ink-3); white-space: nowrap;
}
.chip.cat { border-color: transparent; background: var(--wb-sunk); }
.metric { font-variant-numeric: tabular-nums; }
.metric b { color: var(--wb-ink-3); font-weight: 600; }
.acts { margin-left: auto; display: flex; align-items: center; gap: 2px; opacity: 0; transition: opacity .15s; }
.item:hover .acts, .item:focus-within .acts { opacity: 1; }
@media (hover: none) { .acts { opacity: 1; } }
.link-more {
  margin-left: 4px; padding: 0; border: 0; background: none;
  color: var(--wb-ink-4); font-size: 11px; text-decoration: underline; text-underline-offset: 2px;
}
.link-more:hover { color: var(--wb-accent-ink); }

.section-label {
  display: flex; align-items: center; gap: 10px;
  margin: 16px 2px 2px; font-size: 11px; letter-spacing: .08em; color: var(--wb-ink-4);
}
.section-label::after { content: ""; flex: 1 1 auto; height: 1px; background: var(--wb-line-soft); }

/* ---------- 通用区块 ---------- */
.block {
  border: 1px solid var(--wb-line-soft); border-radius: 12px;
  background: var(--wb-surface); box-shadow: var(--wb-card-shadow);
}
.block-head {
  display: flex; align-items: baseline; gap: 8px;
  padding: 12px 16px 0;
}
.block-head h2 { margin: 0; font-size: 13.5px; font-weight: 600; }
.block-head .hint { font-size: 11px; color: var(--wb-ink-4); }
.block-body { padding: 10px 16px 14px; }

/* ---------- 收藏 ---------- */
.seg-bar { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
.seg {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 11px; border: 1px solid transparent; border-radius: 999px;
  background: transparent; color: var(--wb-ink-4); font-size: 12px;
}
.seg:hover { background: var(--wb-accent-softer); color: var(--wb-ink); }
.seg.on { background: var(--wb-accent-soft); border-color: color-mix(in srgb, var(--wb-accent) 25%, transparent); color: var(--wb-ink); font-weight: 600; }
.seg .n { font-size: 10.5px; color: var(--wb-ink-4); font-variant-numeric: tabular-nums; }
.seg.on .n { color: var(--wb-accent-ink); }

.srow {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px;
  padding: 13px 16px; border-bottom: 1px solid var(--wb-line-soft);
  transition: background .15s;
}
.srow:last-child { border-bottom: 0; }
.srow:hover { background: var(--wb-surface-2); }
.srow-top { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 11.5px; color: var(--wb-ink-4); }
.srow-title { margin: 2px 0 0; font-size: 13.5px; font-weight: 600; line-height: 1.5; }
.srow-title a { color: inherit; text-decoration: none; }
.srow-title a:hover { color: var(--wb-accent-ink); text-decoration: underline; text-underline-offset: 2px; }
.srow-note { margin: 3px 0 0; font-size: 12.2px; color: var(--wb-ink-3); line-height: 1.6; }
.srow-side { display: flex; align-items: flex-start; gap: 6px; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; margin-top: 2px; }
.status-dot.todo { background: var(--wb-amber); }
.status-dot.reading { background: var(--wb-accent); }
.status-dot.done { background: var(--wb-ok); }
.status-dot.dropped { background: var(--wb-ink-4); }
.select-mini {
  appearance: none; border: 1px solid var(--wb-line); border-radius: 7px;
  background: var(--wb-surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%2389979d' stroke-width='2.4'><path d='m6 9 6 6 6-6'/></svg>") no-repeat right 7px center;
  color: var(--wb-ink-3); padding: 3px 22px 3px 8px; font-size: 11.5px;
}
.select-mini:hover { border-color: var(--wb-line-strong); }
.srow-acts { display: flex; gap: 2px; }

.addcard { margin-bottom: 14px; padding: 14px 16px 15px; border: 1px solid var(--wb-line); border-radius: 12px; background: var(--wb-sunk); }
.addcard h2 { margin: 0 0 10px; font-size: 12.5px; font-weight: 600; color: var(--wb-ink-2); }
.form-grid { display: grid; gap: 8px; }
.form-row { display: flex; gap: 8px; flex-wrap: wrap; }
.field {
  width: 100%; border: 1px solid var(--wb-line); border-radius: 8px;
  background: var(--wb-surface); color: var(--wb-ink);
  padding: 6px 10px; font-size: 12.8px; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.field::placeholder { color: var(--wb-ink-4); }
.field:focus { border-color: var(--wb-accent); box-shadow: 0 0 0 3px var(--wb-accent-softer); }
textarea.field { resize: vertical; min-height: 46px; line-height: 1.6; }
.form-foot { display: flex; align-items: center; gap: 10px; }
.form-foot .hint { font-size: 11.5px; color: var(--wb-ink-4); }

.export { margin-bottom: 14px; padding: 12px 14px 14px; border: 1px solid var(--wb-line); border-radius: 12px; background: var(--wb-sunk); }
.export textarea {
  width: 100%; min-height: 190px; resize: vertical;
  border: 1px solid var(--wb-line); border-radius: 8px; background: var(--wb-bg);
  color: var(--wb-ink-2); padding: 10px 12px;
  font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace;
  font-size: 11.5px; line-height: 1.65; outline: none;
}
.export-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.export-head h2 { margin: 0; font-size: 12.5px; font-weight: 600; }
.export-head .hint { font-size: 11.5px; color: var(--wb-ink-4); }

/* ---------- 雷达 ---------- */
.radar-form { display: flex; gap: 8px; margin-bottom: 10px; }
.radar-form .field { flex: 1 1 auto; }
.suggests { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.suggest {
  border: 1px dashed var(--wb-line-strong); border-radius: 999px;
  background: transparent; color: var(--wb-ink-3); padding: 2px 10px; font-size: 11.5px;
}
.suggest:hover { border-style: solid; border-color: var(--wb-accent); color: var(--wb-accent-ink); background: var(--wb-accent-softer); }
.radar-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
.rgroup { border: 1px solid var(--wb-line-soft); border-radius: 12px; background: var(--wb-surface); box-shadow: var(--wb-card-shadow); overflow: hidden; }
.rgroup-head { display: flex; align-items: center; gap: 8px; padding: 12px 15px 10px; border-bottom: 1px solid var(--wb-line-soft); }
.rgroup-head h2 { margin: 0; font-size: 13.5px; font-weight: 600; }
.rgroup-head .count { font-size: 11px; color: var(--wb-ink-4); }
.rgroup-head .del { margin-left: auto; }
.rgroup-body { padding: 4px 8px 8px; }
.rrow { display: flex; align-items: baseline; gap: 8px; padding: 6px 7px; border-radius: 7px; font-size: 12.4px; }
.rrow:hover { background: var(--wb-accent-softer); }
.rrow .idx { width: 16px; flex: 0 0 auto; color: var(--wb-ink-4); font-size: 11px; font-variant-numeric: tabular-nums; }
.rrow .txt { flex: 1 1 auto; min-width: 0; color: var(--wb-ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rrow a.txt { text-decoration: none; color: var(--wb-ink-2); }
.rrow a.txt:hover { color: var(--wb-accent-ink); text-decoration: underline; }
.rrow .side { flex: 0 0 auto; font-size: 10.5px; color: var(--wb-ink-4); font-variant-numeric: tabular-nums; }

/* ---------- 社区 ---------- */
.cols { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.crow {
  display: flex; align-items: baseline; gap: 9px;
  padding: 7px 8px; border-radius: 7px; font-size: 12.5px;
}
.crow:hover { background: var(--wb-accent-softer); }
.crow .idx { width: 18px; flex: 0 0 auto; color: var(--wb-ink-4); font-size: 11px; font-variant-numeric: tabular-nums; }
.crow .txt { flex: 1 1 auto; min-width: 0; }
.crow .txt a { color: var(--wb-ink-2); text-decoration: none; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow .txt a:hover { color: var(--wb-accent-ink); text-decoration: underline; text-underline-offset: 2px; }
.crow .txt small { display: block; margin-top: 1px; font-size: 11px; color: var(--wb-ink-4); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow .side { flex: 0 0 auto; font-size: 10.5px; color: var(--wb-ink-4); font-variant-numeric: tabular-nums; }
.crow .side b { color: var(--wb-ok); font-weight: 600; }

/* ---------- AI 羊毛 ---------- */
.deal-date {
  padding-top: 1px; display: flex; flex-direction: column; gap: 1px;
  font-size: 13px; font-weight: 650; line-height: 1.4; color: var(--wb-ink-3);
  font-variant-numeric: tabular-nums; letter-spacing: -.01em;
}
.deal-date small { font-size: 10px; font-weight: 400; color: var(--wb-ink-4); letter-spacing: 0; }
/* 羊毛卡片没有指标行，操作按钮常显，不然卡片底部像是空的 */
.item.deal .acts { opacity: 1; }

/* ---------- 日历 ---------- */
.month { margin: 18px 0 8px; font-size: 11px; letter-spacing: .08em; color: var(--wb-ink-4); }
.dayrow {
  display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 14px; align-items: start;
  padding: 13px 16px; border-bottom: 1px solid var(--wb-line-soft);
  width: 100%; text-align: left; background: transparent; border-left: 0; border-right: 0; border-top: 0;
  white-space: normal;
  transition: background .15s;
}
.dayrow:first-of-type { border-top: 1px solid var(--wb-line-soft); }
.dayrow:hover { background: var(--wb-surface-2); }
.dayrow .date { display: flex; flex-direction: column; gap: 1px; }
.dayrow .date b { font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.dayrow .date span { font-size: 10.5px; color: var(--wb-ink-4); }
.dayrow .leadtitle { font-size: 13.5px; font-weight: 600; line-height: 1.5; }
.dayrow .leadpara { margin: 3px 0 0; font-size: 12px; line-height: 1.6; color: var(--wb-ink-3); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dayrow .go { opacity: 0; color: var(--wb-ink-4); transition: opacity .15s, transform .15s; }
.dayrow:hover .go { opacity: 1; transform: translateX(2px); }

/* ---------- 状态 ---------- */
.state { padding: 28px 16px; text-align: center; color: var(--wb-ink-4); font-size: 12.5px; }
.state strong { display: block; margin-bottom: 4px; color: var(--wb-ink-2); font-size: 13px; font-weight: 600; }
.state .btn { margin-top: 10px; }
.state-error { color: var(--wb-hot); }
.empty {
  padding: 34px 20px; text-align: center; border: 1px dashed var(--wb-line-strong); border-radius: 12px;
  color: var(--wb-ink-4); font-size: 12.5px;
}
.empty strong { display: block; margin-bottom: 5px; color: var(--wb-ink-2); font-size: 13.5px; }
.empty .btn { margin-top: 12px; }

.skeleton { display: flex; flex-direction: column; gap: 8px; }
.sk-item { padding: 15px 16px; border: 1px solid var(--wb-line-soft); border-radius: 12px; background: var(--wb-surface); }
.sk { height: 11px; border-radius: 5px; margin: 5px 0; background: linear-gradient(90deg, var(--wb-line-soft) 20%, var(--wb-line-strong) 45%, var(--wb-line-soft) 70%); background-size: 220% 100%; animation: sk 1.4s linear infinite; }
.sk.w40 { width: 40%; } .sk.w25 { width: 25%; } .sk.w70 { width: 70%; } .sk.w90 { width: 90%; }
@keyframes sk { from { background-position: 120% 0; } to { background-position: -120% 0; } }
@media (prefers-reduced-motion: reduce) {
  .sk { animation: none; }
  .item, .dayrow, .acts, .go { transition: none; }
}

.attribution { margin-top: 18px; font-size: 11px; line-height: 1.7; color: var(--wb-ink-4); }
.attribution button { padding: 0; border: 0; background: none; color: var(--wb-ink-3); text-decoration: underline; text-underline-offset: 2px; }
.attribution button:hover { color: var(--wb-accent-ink); }

.toast {
  position: fixed; right: 18px; bottom: 16px; z-index: 30;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 13px; border: 1px solid var(--wb-line-strong); border-radius: 9px;
  background: var(--wb-raised); color: var(--wb-ink-2);
  font-size: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.28);
  opacity: 0; transform: translateY(6px); pointer-events: none;
  transition: opacity .18s, transform .18s;
}
.toast.on { opacity: 1; transform: translateY(0); }
.toast.bad { color: var(--wb-hot); border-color: color-mix(in srgb, var(--wb-hot) 40%, var(--wb-line)); }

/* ---------- 窄窗口：资料栏收成顶部胶囊 ---------- */
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .rail { flex-direction: row; align-items: center; gap: 10px; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--wb-line-soft); }
  .brand { padding: 0; }
  .brand em, .rail-foot, .group-label { display: none; }
  .rail-nav { flex-direction: row; overflow-x: auto; gap: 2px; }
  .nav-item { width: auto; white-space: nowrap; }
  .nav-item .badge { margin-left: 2px; }
  .content { padding: 16px 16px 44px; }
  .daybar { top: -16px; }
  .page-head h1 { font-size: 18px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">

<script>
(function () {
  'use strict'

  var sdk = window.torraPlugin
  var state = {
    view: 'hot',
    date: todayKey(),
    layout: 'grid3',
    hot: null,
    saved: [],
    savedTags: [],
    savedFilter: '',
    savedKeys: {},
    radar: null,
    dailies: null,
    community: null,
    promos: null,
    dealsDate: '',
    search: null,
    seq: 0,
  }
  var timers = { toast: 0, saved: 0 }

  /* ---------- 小工具 ---------- */
  function el(id) { return document.getElementById(id) }
  function call(method, params) {
    if (!sdk) return Promise.reject(new Error('面板 SDK 没就绪'))
    return sdk.call(method, params || {})
  }
  /* time-helpers:start */
  function pad(n) { return n < 10 ? '0' + n : String(n) }
  function todayKey() {
    var d = new Date()
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
  }
  function shiftDay(key, delta) {
    var parts = String(key).split('-').map(Number)
    var d = new Date(parts[0], parts[1] - 1, parts[2] + delta)
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
  }
  function weekday(key) {
    var parts = String(key).split('-').map(Number)
    return ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][new Date(parts[0], parts[1] - 1, parts[2]).getDay()]
  }
  function monthDay(key) {
    var parts = String(key).split('-').map(Number)
    return parts[1] + '/' + parts[2]
  }
  /**
   * 时间戳有两种形态：AIHOT 的接口给 ISO 字符串，本地收藏记的是毫秒数。
   * 这里统一成毫秒，解析不出来就当没有时间，别在页面上印 NaN。
   */
  function toMillis(ts) {
    if (ts == null || ts === '') return 0
    if (typeof ts === 'number') return Number.isFinite(ts) ? ts : 0
    var text = String(ts)
    if (/^\d+$/.test(text)) {
      var n = Number(text)
      if (!Number.isFinite(n) || n <= 0) return 0
      return n < 1e11 ? n * 1000 : n
    }
    var parsed = Date.parse(text)
    return Number.isFinite(parsed) ? parsed : 0
  }
  function clock(ts) {
    var at = toMillis(ts)
    if (!at) return ''
    var d = new Date(at)
    return pad(d.getHours()) + ':' + pad(d.getMinutes())
  }
  /** 时间戳落到本地哪一天（YYYY-MM-DD）；羊毛的日期分类用它分组 */
  function dayOf(ts) {
    var at = toMillis(ts)
    if (!at) return ''
    var d = new Date(at)
    var m = d.getMonth() + 1
    var day = d.getDate()
    return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day)
  }
  function dateTime(ts) {
    var at = toMillis(ts)
    if (!at) return ''
    var d = new Date(at)
    return d.getMonth() + 1 + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes())
  }
  function ago(ts) {
    var at = toMillis(ts)
    if (!at) return ''
    var diff = Date.now() - at
    if (diff < 0) return dateTime(at)
    if (diff < 60000) return '刚刚'
    if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前'
    if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前'
    if (diff < 86400000 * 7) return Math.floor(diff / 86400000) + ' 天前'
    return dateTime(at)
  }
  /* time-helpers:end */
  function str(value) { return value == null ? '' : String(value) }
  function errText(error) { return str(error && error.message ? error.message : error) || '未知错误' }
  function open(url) {
    if (!url) return
    call('host.open_external', { url: url }).catch(function () {})
  }
  function toast(message, bad) {
    var node = el('toast')
    node.textContent = message
    node.className = 'toast on' + (bad ? ' bad' : '')
    clearTimeout(timers.toast)
    timers.toast = setTimeout(function () { node.className = 'toast' }, 2600)
  }
  function svg(paths, size) {
    return '<svg width="' + (size || 13) + '" height="' + (size || 13) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>'
  }
  var ICON = {
    bookmark: svg('<path d="M6.5 3.5h11a.5.5 0 0 1 .5.5v17l-6-4.2L6 21V4a.5.5 0 0 1 .5-.5Z"/>'),
    external: svg('<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'),
    refresh: svg('<path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4h-4"/>'),
    plus: svg('<path d="M12 5v14M5 12h14"/>'),
    close: svg('<path d="M6 6l12 12M18 6 6 18"/>'),
    copy: svg('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h9"/>'),
    arrow: svg('<path d="M5 12h14M13 6l6 6-6 6"/>'),
    check: svg('<path d="m5 12 5 5L19 7"/>'),
    search: svg('<circle cx="11" cy="11" r="7"/><path d="m16.4 16.4 4.1 4.1"/>'),
    rows: svg('<path d="M4 7h16M4 12h16M4 17h16"/>'),
    cols2: svg('<rect x="4" y="5" width="7" height="14" rx="1.6"/><rect x="13" y="5" width="7" height="14" rx="1.6"/>'),
    cols3: svg('<rect x="3" y="5" width="5" height="14" rx="1.4"/><rect x="9.5" y="5" width="5" height="14" rx="1.4"/><rect x="16" y="5" width="5" height="14" rx="1.4"/>'),
  }

  function copyText(text, done, fail) {
    function legacy() {
      try {
        var ta = document.createElement('textarea')
        ta.value = text
        ta.style.position = 'fixed'
        ta.style.opacity = '0'
        document.body.appendChild(ta)
        ta.select()
        var ok = document.execCommand('copy')
        document.body.removeChild(ta)
        if (ok) done()
        else fail()
      } catch (error) {
        fail()
      }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, legacy)
        return
      }
    } catch (error) { /* 剪贴板被 Permissions-Policy 挡住时走兜底 */ }
    legacy()
  }

  function savedKey(title, url) { return str(url) || str(title) }

  /* ---------- 站标 ----------
   * 面板帧连不了网，图标让宿主代取（host.icon 走渲染层同一份 favicon 缓存），
   * 拿回来的是 data: 地址。按域名缓存结果：取不到就记住失败，别每条都重试。
   */
  var ICONS = {}
  function hostOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, '') } catch (error) { return '' }
  }
  function loadIcon(host) {
    if (host in ICONS) return ICONS[host]
    var job = call('host.icon', { domain: host }).then(function (payload) {
      var dataUrl = payload && payload.dataUrl
      if (!dataUrl) throw new Error('没有图标')
      ICONS[host] = dataUrl
      return dataUrl
    }, function (error) {
      ICONS[host] = null
      throw error
    })
    ICONS[host] = job
    return job
  }
  function favicon(url, size) {
    var host = hostOf(url)
    if (!host) return null
    var img = document.createElement('img')
    img.className = 'favicon'
    img.alt = ''
    img.width = size || 16
    img.height = size || 16
    img.loading = 'lazy'
    img.referrerPolicy = 'no-referrer'
    var cached = ICONS[host]
    if (typeof cached === 'string') img.src = cached
    else if (cached === null) img.hidden = true
    else loadIcon(host).then(function (dataUrl) { img.src = dataUrl }, function () { img.hidden = true })
    return img
  }

  /* ---------- 导航 ---------- */
  function setView(view) {
    state.view = view
    var items = document.querySelectorAll('.nav-item')
    for (var i = 0; i < items.length; i += 1) {
      var on = items[i].getAttribute('data-view') === view
      items[i].classList.toggle('on', on)
      items[i].setAttribute('aria-selected', on ? 'true' : 'false')
    }
    el('content').scrollTop = 0
    if (view === 'hot') showHot()
    else if (view === 'calendar') showCalendar()
    else if (view === 'radar') showRadar()
    else if (view === 'saved') showSaved()
    else if (view === 'deals') showDeals()
    else showCommunity()
  }

  function head(title, sub, tools) {
    return '<div class="page-head"><div><h1>' + title + '</h1><p class="sub">' + sub + '</p></div>' +
      '<div class="head-tools">' + (tools || '') + '</div></div>'
  }

  function skeleton(count) {
    var out = '<div class="skeleton">'
    for (var i = 0; i < (count || 5); i += 1) {
      out += '<div class="sk-item"><div class="sk w25"></div><div class="sk w70"></div><div class="sk w90"></div></div>'
    }
    return out + '</div>'
  }

  function emptyBox(title, copy, action) {
    return '<div class="empty"><strong>' + title + '</strong>' + copy + (action || '') + '</div>'
  }

  function errorBox(message, action, id) {
    return '<div class="state state-error"><strong>没取到数据</strong>' + esc(message) +
      (action ? '<div><button class="btn" data-retry="' + (id || '') + '">重试</button></div>' : '') + '</div>'
  }

  function esc(text) {
    return str(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
  }

  function bindRetry(id, fn) {
    var node = document.querySelector('[data-retry="' + id + '"]')
    if (node) node.addEventListener('click', fn)
  }

  /* ---------- 卡片布局 ----------
   * 面板是沙箱帧，localStorage 用不了，偏好存在插件的 state 里；
   * 旧进程没有 prefs.* 接口时静默回落到三列，不影响使用。
   */
  var LAYOUTS = [
    { id: 'list', label: '列表', icon: 'rows' },
    { id: 'grid2', label: '两列', icon: 'cols2' },
    { id: 'grid3', label: '三列', icon: 'cols3' },
  ]

  function layoutSwitch() {
    var html = '<div class="layout-switch" role="group" aria-label="卡片布局">'
    for (var i = 0; i < LAYOUTS.length; i += 1) {
      var mode = LAYOUTS[i]
      var on = mode.id === state.layout
      html += '<button type="button" class="layout-btn' + (on ? ' on' : '') + '" data-layout-set="' + mode.id + '"' +
        ' aria-pressed="' + (on ? 'true' : 'false') + '" title="' + mode.label + '" aria-label="' + mode.label + '">' +
        ICON[mode.icon] + '</button>'
    }
    return html + '</div>'
  }

  function applyLayout(id) {
    if (id === 'list' || id === 'grid2' || id === 'grid3') state.layout = id
    document.documentElement.setAttribute('data-layout', state.layout)
    var buttons = document.querySelectorAll('[data-layout-set]')
    for (var i = 0; i < buttons.length; i += 1) {
      var on = buttons[i].getAttribute('data-layout-set') === state.layout
      buttons[i].classList.toggle('on', on)
      buttons[i].setAttribute('aria-pressed', on ? 'true' : 'false')
    }
  }

  function setLayout(id) {
    if (id === state.layout) return
    applyLayout(id)
    call('prefs.set', { layout: state.layout }).catch(function () { })
  }

  function bindLayoutSwitch() {
    var buttons = document.querySelectorAll('[data-layout-set]')
    for (var i = 0; i < buttons.length; i += 1) {
      buttons[i].addEventListener('click', function (event) {
        setLayout(event.currentTarget.getAttribute('data-layout-set'))
      })
    }
  }

  /* ---------- 收藏徽标 ---------- */
  function paintBadge() {
    var node = el('nav-badge')
    var count = state.saved.length
    node.hidden = count === 0
    node.textContent = count > 99 ? '99+' : String(count)
  }

  function refreshSavedKeys() {
    state.savedKeys = {}
    state.saved.forEach(function (item) {
      state.savedKeys[savedKey(item.title, item.url)] = true
    })
    paintBadge()
  }

  function loadSavedKeys() {
    return call('saved.list', {}).then(function (payload) {
      state.saved = (payload && payload.items) || []
      state.savedTags = (payload && payload.tags) || []
      refreshSavedKeys()
      return state.saved
    }, function () { return [] })
  }

  function saveItem(item, button) {
    var url = (item.links && item.links.original) || (item.links && item.links.aihot) || item.url || ''
    call('saved.add', {
      title: item.title || '',
      url: url,
      summary: item.summary || '',
      source: item.source || '',
      tags: item.category ? [item.category] : [],
    }).then(function () {
      state.savedKeys[savedKey(item.title, url)] = true
      state.saved.unshift({ title: item.title, url: url, status: 'todo', tags: item.category ? [item.category] : [], updatedAt: Date.now() })
      paintBadge()
      if (button) {
        button.innerHTML = ICON.check + '已收藏'
        button.disabled = true
      }
      toast('已加入收藏队列')
    }, function (error) {
      toast(errText(error), true)
    })
  }

  /* ---------- 热点 ---------- */
  function modeTag(mode) {
    if (mode === 'live') return '<span class="mode-tag hot">实时热榜</span>'
    if (mode === 'rerank') return '<span class="mode-tag">评分重排</span>'
    if (mode === 'daily') return '<span class="mode-tag daily">当日日报</span>'
    return ''
  }

  function showHot() {
    var date = state.date
    var tools = layoutSwitch() +
      '<button class="btn ghost" data-act="search">' + ICON.search + '搜索</button>'
    if (date !== todayKey()) tools += '<button class="btn" data-act="today">回到今天</button>'
    tools += '<button class="btn" data-act="refresh">' + ICON.refresh + '刷新</button>'
    el('content').innerHTML =
      '<div class="wrap cards">' +
        head('AI 热点', '把今天 AI 圈的事，按热度排成一条线', tools) +
        '<div class="daybar"><div class="days" id="days"></div></div>' +
        '<div id="hot-body">' + skeleton(5) + '</div>' +
        '<p class="attribution" id="hot-note"></p>' +
      '</div>'
    buildDays()
    bindHotActions()
    bindLayoutSwitch()
    if (state.search && state.search.q) renderSearch()
    else loadHot(date)
  }

  function buildDays() {
    var strip = el('days')
    var today = todayKey()
    var html = ''
    for (var i = 13; i >= 0; i -= 1) {
      var key = shiftDay(today, -i)
      var on = key === state.date
      html += '<button class="day' + (on ? ' on' : '') + (key === today ? ' today' : '') + '" data-date="' + key + '" title="' + key + '">' +
        '<b>' + monthDay(key) + '</b><small>' + (key === today ? '今天' : weekday(key)) + '</small></button>'
    }
    strip.innerHTML = html
    var buttons = strip.querySelectorAll('.day')
    for (var j = 0; j < buttons.length; j += 1) {
      buttons[j].addEventListener('click', function (event) {
        var key = event.currentTarget.getAttribute('data-date')
        if (key === state.date) return
        state.date = key
        state.search = null
        buildDays()
        loadHot(key)
      })
    }
    var active = strip.querySelector('.day.on')
    if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'center' })
  }

  function bindHotActions() {
    var content = el('content')
    content.querySelectorAll('[data-act]').forEach(function (button) {
      button.addEventListener('click', function () {
        var act = button.getAttribute('data-act')
        if (act === 'today') {
          state.date = todayKey()
          state.search = null
          buildDays()
          loadHot(state.date)
        } else if (act === 'refresh') {
          call('cache.clear', {}).catch(function () { }).then(function () {
            state.search = null
            loadHot(state.date)
          })
        } else if (act === 'search') {
          openSearch()
        }
      })
    })
  }

  function openSearch() {
    var body = el('hot-body')
    if (!body) return
    body.innerHTML =
      '<div class="addcard"><h2>在近 7 天的条目里检索</h2>' +
        '<div class="radar-form"><input class="field" id="hot-search" placeholder="关键词，例如 agent、芯片、开源模型" autocomplete="off" />' +
        '<button class="btn primary" id="hot-search-go">检索</button>' +
        '<button class="btn ghost" id="hot-search-cancel">取消</button></div>' +
        '<p class="form-foot"><span class="hint">检索走 AIHOT 的条目接口，不改动当前日期。</span></p>' +
      '</div>'
    var input = el('hot-search')
    input.focus()
    function go() {
      var q = input.value.trim()
      if (!q) return
      state.search = { q: q, items: null, error: '' }
      renderSearch()
    }
    el('hot-search-go').addEventListener('click', go)
    input.addEventListener('keydown', function (event) { if (event.key === 'Enter') go() })
    el('hot-search-cancel').addEventListener('click', function () { state.search = null; loadHot(state.date) })
  }

  function renderSearch() {
    var box = el('hot-body')
    if (!box || !state.search) return
    var search = state.search
    state.seq += 1
    var seq = state.seq
    if (!search.items && !search.error) {
      box.innerHTML = '<div class="section-label">检索「' + esc(search.q) + '」</div>' + skeleton(4)
      call('search', { q: search.q, limit: 30 }).then(function (payload) {
        if (seq !== state.seq) return
        search.items = (payload && payload.items) || []
        renderSearch()
      }, function (error) {
        if (seq !== state.seq) return
        search.error = errText(error)
        renderSearch()
      })
      return
    }
    if (search.error) {
      box.innerHTML = '<div class="section-label">检索「' + esc(search.q) + '」</div>' + errorBox(search.error, true, 'search')
      bindRetry('search', function () { search.error = ''; renderSearch() })
      return
    }
    var head = '<div class="section-label">检索「' + esc(search.q) + '」 · ' + search.items.length + ' 条' +
      ' <button class="link-more" id="search-clear">清除</button></div>'
    if (!search.items.length) {
      box.innerHTML = head + emptyBox('没有匹配的条目', '换一个词，或回到热点列表看看。')
      bindSearchClear()
      return
    }
    box.innerHTML = head + '<div class="list cards" id="search-list"></div>'
    var list = el('search-list')
    search.items.forEach(function (item, index) { list.appendChild(hotRow(item, index, true)) })
    bindSearchClear()
  }

  function bindSearchClear() {
    var button = el('search-clear')
    if (button) button.addEventListener('click', function () {
      state.search = null
      loadHot(state.date)
    })
  }

  function loadHot(date) {
    var box = el('hot-body')
    if (!box) return
    state.seq += 1
    var seq = state.seq
    box.innerHTML = skeleton(5)
    call('hot', { date: date }).then(function (payload) {
      if (seq !== state.seq) return
      state.hot = payload
      renderHot(payload)
    }, function (error) {
      if (seq !== state.seq) return
      box.innerHTML = errorBox(errText(error), true, 'hot')
      bindRetry('hot', function () { loadHot(state.date) })
    })
  }

  function renderHot(payload) {
    var box = el('hot-body')
    if (!box) return
    var date = payload.date || state.date
    var metric = payload.metric || ''
    var sub = (date === todayKey() ? '今天' : date + ' · ' + weekday(date)) +
      (metric ? ' · ' + metric : '')
    var pageHead = el('content').querySelector('.page-head')
    if (pageHead) {
      pageHead.querySelector('.sub').textContent = sub
      var h1 = pageHead.querySelector('h1')
      if (h1) h1.innerHTML = 'AI 热点 ' + modeTag(payload.mode)
    }
    var html = ''
    if (payload.lead && payload.lead.title) {
      html += '<div class="lead"><span class="kicker">今日主线</span><h2>' + esc(payload.lead.title) + '</h2>' +
        (payload.lead.paragraph ? '<p>' + esc(payload.lead.paragraph) + '</p>' : '') + '</div>'
    }
    if (!payload.items || !payload.items.length) {
      html += emptyBox('这一天没有条目', payload.mode === 'daily'
        ? 'AIHOT 的日报在这一天没有内容。'
        : '近 7 天的条目只覆盖最近一周，可以挑一天看看。')
    } else {
      html += '<div class="list cards" id="hot-list"></div>'
    }
    box.innerHTML = html
    var list = el('hot-list')
    if (list) {
      var lastSection = null
      payload.items.forEach(function (item, index) {
        if (payload.mode === 'daily' && item.section && item.section !== lastSection) {
          lastSection = item.section
          var label = document.createElement('div')
          label.className = 'section-label'
          label.textContent = item.section
          list.appendChild(label)
        }
        list.appendChild(hotRow(item, index, false))
      })
    }
    var note = el('hot-note')
    if (note) {
      note.innerHTML = '数据来自 <button type="button" data-src>AIHOT（aihot.news）</button>：今天的榜是它的实时排序，' +
        '近 7 天按评分重排，更早的日期读当日日报。AIHOT 面向个人与非商用场景免费，商用需获授权。'
      var src = note.querySelector('[data-src]')
      if (src) src.addEventListener('click', function () { open('https://aihot.news') })
    }
  }

  function hotRow(item, index, isSearch) {
    var article = document.createElement('article')
    article.className = 'item'
    var rank = document.createElement('span')
    var rankNo = item.rank || index + 1
    rank.className = 'rank' + (!isSearch && rankNo <= 3 ? ' r' + rankNo : '') + (isSearch ? ' search' : '')
    rank.textContent = isSearch ? pad(index + 1) : String(rankNo)
    article.appendChild(rank)

    var main = document.createElement('div')
    main.className = 'item-main'
    var url = (item.links && item.links.original) || (item.links && item.links.aihot) || ''

    var head = document.createElement('div')
    head.className = 'item-head'
    var bits = []
    if (item.source) bits.push('<span class="src">' + esc(item.source) + '</span>')
    if (item.publishedAt) bits.push('<span>' + esc(dateTime(item.publishedAt)) + '</span>')
    else if (item.latestAt) bits.push('<span>' + esc(ago(item.latestAt)) + '</span>')
    if (item.section) bits.push('<span class="chip">' + esc(item.section) + '</span>')
    if (item.category) bits.push('<span class="chip cat">' + esc(item.category) + '</span>')
    head.innerHTML = bits.join('<span class="sep"></span>')
    var icon = favicon(url, 16)
    if (icon && head.firstChild) head.insertBefore(icon, head.firstChild)
    if (head.childNodes.length) main.appendChild(head)

    var title = document.createElement('h2')
    title.className = 'item-title'
    if (url) {
      var a = document.createElement('a')
      a.href = url
      a.textContent = item.title || '(无标题)'
      a.addEventListener('click', function (event) { event.preventDefault(); open(url) })
      title.appendChild(a)
    } else {
      title.textContent = item.title || '(无标题)'
    }
    main.appendChild(title)

    if (item.summary) {
      var summary = document.createElement('p')
      summary.className = 'item-summary'
      summary.textContent = item.summary
      main.appendChild(summary)
      if (item.summary.length > 96) {
        var more = document.createElement('button')
        more.className = 'link-more'
        more.type = 'button'
        more.textContent = '展开'
        more.addEventListener('click', function () {
          var openNow = summary.classList.toggle('open')
          more.textContent = openNow ? '收起' : '展开'
        })
        summary.appendChild(document.createTextNode(' '))
        summary.parentNode.insertBefore(more, summary.nextSibling)
        // 摘要在 clamp 状态下点击「展开」，按钮仍留在摘要下方
        more.style.marginTop = '2px'
      }
    }

    var foot = document.createElement('div')
    foot.className = 'item-foot'
    if (item.score) foot.appendChild(metric('评分', item.score))
    if (item.signalCount) foot.appendChild(metric('信号', item.signalCount))
    if (item.sourceCount) foot.appendChild(metric('来源', item.sourceCount))
    if (item.participantCount) foot.appendChild(metric('参与', item.participantCount))

    var acts = document.createElement('div')
    acts.className = 'acts'
    var save = document.createElement('button')
    save.className = 'btn ghost'
    var key = savedKey(item.title, url)
    if (state.savedKeys[key]) {
      save.innerHTML = ICON.check + '已收藏'
      save.disabled = true
    } else {
      save.innerHTML = ICON.bookmark + '收藏'
      save.addEventListener('click', function () { saveItem(item, save) })
    }
    acts.appendChild(save)
    if (url) {
      var source = document.createElement('button')
      source.className = 'btn ghost'
      source.innerHTML = '原文' + ICON.external
      source.addEventListener('click', function () { open(url) })
      acts.appendChild(source)
    }
    if (item.links && item.links.aihot && item.links.aihot !== url) {
      var hot = document.createElement('button')
      hot.className = 'btn ghost'
      hot.textContent = 'AIHOT'
      hot.addEventListener('click', function () { open(item.links.aihot) })
      acts.appendChild(hot)
    }
    foot.appendChild(acts)
    main.appendChild(foot)
    article.appendChild(main)
    return article
  }

  function metric(label, value) {
    var span = document.createElement('span')
    span.className = 'metric'
    span.innerHTML = label + ' <b>' + esc(value) + '</b>'
    return span
  }

  /* ---------- 收藏 ---------- */
  var STATUS = [
    { key: 'todo', label: '待读' },
    { key: 'reading', label: '在读' },
    { key: 'done', label: '已读' },
    { key: 'dropped', label: '已放弃' },
  ]

  function statusLabel(key) {
    for (var i = 0; i < STATUS.length; i += 1) if (STATUS[i].key === key) return STATUS[i].label
    return key
  }

  function showSaved() {
    el('content').innerHTML =
      '<div class="wrap">' +
        head('收藏队列', '先收着，读的时候再一条条清掉', '<button class="btn" data-act="export">' + ICON.copy + '导出 Markdown</button>' +
          '<button class="btn primary" data-act="add">' + ICON.plus + '新增收藏</button>') +
        '<div class="seg-bar" id="saved-filters"></div>' +
        '<div id="saved-form-slot"></div>' +
        '<div id="saved-export-slot"></div>' +
        '<div class="block" id="saved-box"><div class="state">正在读收藏…</div></div>' +
        '<p class="attribution">收藏与状态只存在本机（插件存储）。导出后可直接粘进笔记或周报。</p>' +
      '</div>'
    bindSavedActions()
    loadSavedList()
  }

  function loadSavedList(status) {
    var box = el('saved-box')
    if (!box) return
    if (status !== undefined) state.savedFilter = status
    call('saved.list', { status: state.savedFilter || '' }).then(function (payload) {
      state.saved = (payload && payload.items) || []
      state.savedTags = (payload && payload.tags) || []
      if (!state.savedKeys || !Object.keys(state.savedKeys).length) refreshSavedKeys()
      paintBadge()
      renderSaved()
    }, function (error) {
      box.innerHTML = errorBox(errText(error), true, 'saved')
      bindRetry('saved', function () { loadSavedList() })
    })
  }

  function renderSaved() {
    var filters = el('saved-filters')
    if (filters) {
      var counts = { '': state.saved.length }
      STATUS.forEach(function (s) { counts[s.key] = 0 })
      state.saved.forEach(function (item) { counts[item.status] = (counts[item.status] || 0) + 1 })
      var html = '<button class="seg' + (!state.savedFilter ? ' on' : '') + '" data-status="">全部 <span class="n">' + counts[''] + '</span></button>'
      STATUS.forEach(function (s) {
        html += '<button class="seg' + (state.savedFilter === s.key ? ' on' : '') + '" data-status="' + s.key + '">' + s.label + ' <span class="n">' + (counts[s.key] || 0) + '</span></button>'
      })
      filters.innerHTML = html
      filters.querySelectorAll('[data-status]').forEach(function (button) {
        button.addEventListener('click', function () { loadSavedList(button.getAttribute('data-status')) })
      })
    }
    var box = el('saved-box')
    if (!box) return
    if (!state.saved.length) {
      box.innerHTML = emptyBox('队列是空的', state.savedFilter ? '这个状态下没有条目，切回「全部」看看。' : '在热点里点「收藏」，或手动加一条。')
      return
    }
    box.innerHTML = '<div id="saved-rows"></div>'
    var rows = el('saved-rows')
    state.saved.forEach(function (item) { rows.appendChild(savedRow(item)) })
  }

  function savedRow(item) {
    var row = document.createElement('div')
    row.className = 'srow'
    var main = document.createElement('div')
    main.className = 'item-main'

    var top = document.createElement('div')
    top.className = 'srow-top'
    top.innerHTML = '<span class="status-dot ' + esc(item.status) + '"></span>' +
      '<span>' + esc(statusLabel(item.status)) + '</span>' +
      '<span class="sep">·</span><span>' + esc(ago(item.updatedAt)) + '</span>' +
      (item.source ? '<span class="sep">·</span><span>' + esc(item.source) + '</span>' : '')
    main.appendChild(top)

    var title = document.createElement('h3')
    title.className = 'srow-title'
    if (item.url) {
      var a = document.createElement('a')
      a.href = item.url
      a.textContent = item.title || item.url
      a.addEventListener('click', function (event) { event.preventDefault(); open(item.url) })
      title.appendChild(a)
    } else {
      title.textContent = item.title || '(无标题)'
    }
    main.appendChild(title)

    if (item.note || item.summary) {
      var note = document.createElement('p')
      note.className = 'srow-note'
      note.textContent = item.note || item.summary
      main.appendChild(note)
    }
    if (item.tags && item.tags.length) {
      var tags = document.createElement('div')
      tags.className = 'item-foot'
      item.tags.forEach(function (tag) {
        var chip = document.createElement('span')
        chip.className = 'chip cat'
        chip.textContent = '# ' + tag
        tags.appendChild(chip)
      })
      main.appendChild(tags)
    }
    row.appendChild(main)

    var side = document.createElement('div')
    side.className = 'srow-side'
    var select = document.createElement('select')
    select.className = 'select-mini'
    select.setAttribute('aria-label', '阅读状态')
    STATUS.forEach(function (s) {
      var option = document.createElement('option')
      option.value = s.key
      option.textContent = s.label
      if (s.key === item.status) option.selected = true
      select.appendChild(option)
    })
    select.addEventListener('change', function () {
      call('saved.update', { id: item.id, status: select.value }).then(function () {
        item.status = select.value
        loadSavedList()
        toast('状态已改为「' + statusLabel(select.value) + '」')
      }, function (error) { toast(errText(error), true) })
    })
    side.appendChild(select)

    var acts = document.createElement('div')
    acts.className = 'srow-acts'
    var remove = document.createElement('button')
    remove.className = 'btn ghost'
    remove.innerHTML = ICON.close
    remove.title = '删除'
    remove.setAttribute('aria-label', '删除这条收藏')
    remove.addEventListener('click', function () {
      if (remove.getAttribute('data-confirm') !== '1') {
        remove.setAttribute('data-confirm', '1')
        remove.style.color = 'var(--wb-hot)'
        remove.title = '再点一次删除'
        toast('再点一次删除这条收藏')
        setTimeout(function () {
          remove.removeAttribute('data-confirm')
          remove.style.color = ''
          remove.title = '删除'
        }, 3000)
        return
      }
      call('saved.remove', { id: item.id }).then(function () {
        toast('已删除')
        loadSavedList()
      }, function (error) { toast(errText(error), true) })
    })
    acts.appendChild(remove)
    side.appendChild(acts)
    row.appendChild(side)
    return row
  }

          var row = document.createElement('div')

          idx.className = 'idx'
          idx.textContent = pad(index + 1)

  /**
   * 羊毛的日期条：只列 RSS 里真有内容的日期，默认「全部」。
   * 和热点日期条一样按天升序排，最新的落在最右边，选中的滚进视野。
   */
  function buildDealDays(items) {
    var bar = el('deals-bar')
    var strip = el('deals-days')
    if (!bar || !strip) return
    var counts = {}
    var order = []
    items.forEach(function (item) {
      var key = dayOf(item.publishedAt)
      if (!key) return
      if (!counts[key]) { counts[key] = 0; order.push(key) }
      counts[key] += 1
    })
    order.sort()
    // 刷新后选中的那一天可能被挤出 30 条窗口，退回全部
    if (state.dealsDate && !counts[state.dealsDate]) state.dealsDate = ''
    if (!order.length) {
      bar.hidden = true
      strip.innerHTML = ''
      return
    }
    bar.hidden = false
    var html = '<button class="day' + (state.dealsDate ? '' : ' on') + '" data-deal-day="">' +
      '<b>全部</b><small>' + items.length + ' 条</small></button>'
    for (var i = 0; i < order.length; i += 1) {
      var key = order[i]
      html += '<button class="day' + (state.dealsDate === key ? ' on' : '') + (key === todayKey() ? ' today' : '') +
        '" data-deal-day="' + key + '"><b>' + monthDay(key) + '</b><small>' +
        (key === todayKey() ? '今天' : weekday(key)) + '</small></button>'
    }
    strip.innerHTML = html
    strip.querySelectorAll('.day').forEach(function (button) {
      button.addEventListener('click', function () {
        var key = button.getAttribute('data-deal-day')
        if (key === state.dealsDate) return
        state.dealsDate = key
        if (state.promos) renderDeals(state.promos)
      })
    })
    var active = strip.querySelector('.day.on')
    if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'center' })
  }

  function dealRow(item, index) {
    var article = document.createElement('article')
    article.className = 'item deal'

    var date = document.createElement('span')
    date.className = 'deal-date'
    var at = toMillis(item.publishedAt)
    if (at) {
      var d = new Date(at)
      var day = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
      var b = document.createElement('b')
      b.textContent = monthDay(day)
      var small = document.createElement('small')
      small.textContent = weekday(day)
      date.appendChild(b)
      date.appendChild(small)
    } else {
      date.textContent = pad(index + 1)
    }
    article.appendChild(date)

    var main = document.createElement('div')
    main.className = 'item-main'

    var head = document.createElement('div')
    head.className = 'item-head'
    var bits = ['<span class="src">' + esc(item.source || 'AI Promo Now') + '</span>']
    if (item.publishedAt) bits.push('<span>' + esc(ago(item.publishedAt)) + '</span>')
    head.innerHTML = bits.join('<span class="sep"></span>')
    var icon = favicon(item.url, 16)
    if (icon && head.firstChild) head.insertBefore(icon, head.firstChild)
    main.appendChild(head)

    var title = document.createElement('h2')
    title.className = 'item-title'
    if (item.url) {
      var a = document.createElement('a')
      a.href = item.url
      a.textContent = item.title || '(无标题)'
      a.addEventListener('click', function (event) { event.preventDefault(); open(item.url) })
      title.appendChild(a)
    } else {
      title.textContent = item.title || '(无标题)'
    }
    main.appendChild(title)

    if (item.summary) {
      var summary = document.createElement('p')
      summary.className = 'item-summary'
      summary.textContent = item.summary
      main.appendChild(summary)
      if (item.summary.length > 96) {
        var more = document.createElement('button')
        more.className = 'link-more'
        more.type = 'button'
        more.textContent = '展开'
        more.addEventListener('click', function () {
          var openNow = summary.classList.toggle('open')
          more.textContent = openNow ? '收起' : '展开'
        })
        more.style.marginTop = '2px'
        summary.parentNode.insertBefore(more, summary.nextSibling)
      }
    }

    var foot = document.createElement('div')
    foot.className = 'item-foot'
    var acts = document.createElement('div')
    acts.className = 'acts'
    var key = savedKey(item.title, item.url)
    var save = document.createElement('button')
    save.className = 'btn ghost'
    if (state.savedKeys[key]) {
      save.innerHTML = ICON.check + '已收藏'
      save.disabled = true
    } else {
      save.innerHTML = ICON.bookmark + '收藏'
      save.addEventListener('click', function () { saveItem(item, save) })
    }
    acts.appendChild(save)
    if (item.url) {
      var go = document.createElement('button')
      go.className = 'btn ghost'
      go.innerHTML = '查看详情' + ICON.external
      go.addEventListener('click', function () { open(item.url) })
      acts.appendChild(go)
    }
    foot.appendChild(acts)
    main.appendChild(foot)
    article.appendChild(main)
    return article
  }

  nav.addEventListener('keydown', function (event) {
    if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return
    var items = Array.prototype.slice.call(nav.querySelectorAll('.nav-item'))
    var index = items.indexOf(document.activeElement)
    if (index < 0) return
    event.preventDefault()
    var next = items[(index + (event.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length]
    next.focus()
    next.click()
  })
  el('src-link').addEventListener('click', function () { open('https://aihot.news') })
  el('src-promo').addEventListener('click', function () { open('https://www.aipromonow.com') })

  applyLayout(state.layout)
  call('prefs.get', {}).then(function (payload) {
    if (payload && payload.layout) applyLayout(payload.layout)
  }, function () { /* 旧进程没有 prefs：本次会话照默认布局走 */ })

  loadSavedKeys().then(function () { setView('hot') })
})()
</script>
</body>
</html>
