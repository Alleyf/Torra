  </defs>
  <rect width="64" height="64" rx="15" fill="#191c38" />
  <g fill="none" stroke="url(#torraArc)" stroke-width="6.4" stroke-linecap="round">
    <path d="M52.28 37.43A21 21 0 0 1 26.56 52.28" />
    <path d="M17.19 46.81A21 21 0 0 1 17.19 17.19" />
    <path d="M26.56 11.72A21 21 0 0 1 52.28 26.56" />
