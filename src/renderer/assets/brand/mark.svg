<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Torra">
  <!-- 品牌标记：三段弧围成圆桌，中心一点是共识。
       几何与 src/renderer/components/BrandMark.tsx 同源（每段 90°、每缺口 30°），
       这里按 64 视图盒等比放大：圆心 32,32、半径 21。 -->
  <defs>
    <linearGradient id="torraArc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#536dfe" />
      <stop offset="1" stop-color="#a78bfa" />
