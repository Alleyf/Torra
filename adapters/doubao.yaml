id: doubao
name: 豆包 网页版
transport: webview
entry: https://www.doubao.com/chat/
selectors:
  # 逆向自 chat.8a2964c561.js 确证：data-testid 是豆包最稳定的钩子，
  # 优于哈希类名（该站 chunk 带哈希、发版频繁，class 名会变）。
  # 2026-10-19 实测（未登录，www.doubao.com/chat/）：输入框已从 textarea 换成
  # ProseMirror（tiptap）contenteditable，而 data-testid="chat_input_input" 如今挂在
  # 包装 div 上 —— 旧的 textarea[...] 选择器命中 0，键入阶段等 15s 后报
  # 「input selector missing」，这就是「豆包未登录发不出去」的真因。
  # 该页没有任何 form[action*=login]，所以它从来不是登录墙，是选择器过期。
  # 三档按「锚在 testid 容器里找可编辑节点 → 兜底旧 textarea」排，实测各档命中：
  # 第一档在引导页与会话页都恰好命中 1 个可见可编辑节点。
  input: '[data-testid="chat_input_input"] .tiptap.ProseMirror, [data-testid="chat_input_input"] [contenteditable="true"], textarea[data-testid="chat_input_input"]'
  # 发送按钮只在框里有字时挂载（实测：空框 0 命中，键入后 1 命中且可见），
  # 与打断按钮同时存在、靠 class 互斥隐藏 —— 完成判定见下方 mode 注释。
  send: '[data-testid="chat_input_send_button"]'
  stop: '[data-testid="chat_input_local_break_button"]'
  # .md-box-root 是无哈希的稳定语义类；外层 markdownContent-XXXXXX 是 CSS Module 哈希，
  # 会随发版变化，故不写进选择器。
  # 实测（2026-10-19 未登录发一轮）：它同时命中用户轮与助手轮（各带
  # data-testid="message_text_content"），stream_mode: last 取末尾即助手正文。
  stream: '.md-box-root'
  # domscan 实测（2026-10-04，真实会话页）：深度思考区是 [data-thinking-box] 属性体系
  # （子节点带 step-message / step-end-expanded 等值），属性语义稳定，且与正文
  # md-box-root 不在同一子树，过程不会混进正文。
  steps: '[data-thinking-box]'
input_kind: contenteditable
send_mode: click
stream_mode: last
steps_mode: all
completion:
  # 豆包的发送与打断按钮同时渲染在 DOM、仅靠 !hidden 类互斥隐藏，
  # 所以完成判定必须基于「可见性」而非「存在性」—— inject.isVisible 已按 offsetParent 处理。
  mode: stop_button_hidden
  timeout_s: 180
automation:
  typing_delay_ms: [80, 220]
  pre_send_pause_ms: [500, 1500]
  max_wait_s: 180
  jitter: true
health_probe: '[data-testid="chat_input_input"] .tiptap.ProseMirror, [data-testid="chat_input_input"] [contenteditable="true"], textarea[data-testid="chat_input_input"]'
verified_at: '2026-10-19'
origin: builtin
note: 普通聊天与深度思考已实测对齐；「工作流/任务」模式的独立文档页未定位到入口（侧栏任务列表不在对话锚点内），若该形态回复容器不同，读取会诚实报「生成结束但未捕获到内容」而非回退旧会话文本 —— 需实测后用 electron scripts/domscan.js doubao --chat <标题> 校准。另：该站未登录可直接对话（实测发一轮能回正文，无需登录），但侧栏「下载桌面端」promo 弹窗会盖住输入区，它只挡真实鼠标点击，不挡注入侧的 el.click()。
tos_notice: 字节跳动服务条款限制自动化访问。请确认你的使用方式符合其条款。
