id: yuanbao
name: 元宝 网页版
transport: webview
entry: https://yuanbao.tencent.com/
selectors:
  # 腾讯元宝的输入区是 Quill 编辑器（contenteditable），不是 textarea。
  # div.ql-editor 是 Quill 的稳定语义类（不带构建哈希），发版不易变。
  input: div.ql-editor
  # 回复容器同理：hyc-content-md 是站点自己的语义类。
  # 元宝一轮里可能拆成多个 markdown 块，所以 stream_mode 用 all。
  stream: div.hyc-content-md
input_kind: contenteditable
send_mode: enter
stream_mode: all
completion:
  # 元宝没有可依赖的「生成中」按钮，按 DOM 稳定判定。
  # stable_ms 取 3000：元宝吐字是连片的，窗口再长会把「慢一拍」当成还在写。
  mode: dom_stable
  stable_ms: 3000
  timeout_s: 216
automation:
  typing_delay_ms: [80, 220]
  pre_send_pause_ms: [500, 1500]
  max_wait_s: 180
  jitter: true
health_probe: div.ql-editor
verified_at: '2026-10-12'
origin: builtin
note: 原为用户自建（web-custom-2）。站点改版后若「模型不回答」，先在设置页的适配器体检里重测这一项。
tos_notice: 腾讯服务条款限制自动化访问。请确认你的使用方式符合其条款。
