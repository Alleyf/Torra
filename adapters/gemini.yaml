id: gemini
name: Gemini
transport: webview
entry: https://gemini.google.com/app
selectors:
  input: 'rich-textarea .ql-editor'
  send: 'button.send-button'
  stream: 'model-response .markdown'
  stop: 'button.stop-button'
completion:
  mode: stop_button_hidden
  timeout_s: 120
automation:
  typing_delay_ms: [80, 220]
  pre_send_pause_ms: [500, 1500]
  max_wait_s: 120
  jitter: true
health_probe: 'rich-textarea .ql-editor'
verified_at: '2026-10-01'
tos_notice: Google 服务条款限制自动化访问。请确认你的使用方式符合其条款。
